name: Retrieve the validated distribution
description: Reuse the exact successful main CI artifact for this release tag without rebuilding.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Find successful CI for the exact tagged commit on main
      id: ci
      uses: actions/github-script@v7
      with:
        script: |
          const { execFileSync } = require('node:child_process');
          if (process.env.GITHUB_REF_TYPE !== 'tag' || !/^v\d+\.\d+\.\d+$/.test(process.env.GITHUB_REF_NAME)) {
            throw new Error('Select a stable version tag when running this workflow.');
          }
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'origin/main']);
          const { data } = await github.rest.actions.listWorkflowRuns({
            ...context.repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 100
          });
          const eligible = data.workflow_runs.filter(run =>
            run.head_sha === sha &&
            run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
            ((run.event === 'push' && run.head_branch === 'main') ||
              (run.event === 'workflow_dispatch' &&
                ['main', process.env.GITHUB_REF_NAME].includes(run.head_branch))));
          eligible.sort((a, b) => b.id - a.id);
          const run = eligible[0];
          if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`Successful CI is required for ${sha}. Wait for CI or manually dispatch CI selecting ${process.env.GITHUB_REF_NAME}, then rerun publication. Latest CI: ${run?.html_url || 'none'}`);
          }
          core.setOutput('run-id', String(run.id));
          core.info(`Reusing tested distribution from ${run.html_url}`);
    - name: Download the CI distribution
      uses: actions/download-artifact@v4
      with:
        name: site-dist
        path: ${{ runner.temp }}/validated-dist
        github-token: ${{ github.token }}
        run-id: ${{ steps.ci.outputs.run-id }}
    - name: Verify commit, release version and distribution hash
      env:
        VALIDATED_DIST: ${{ runner.temp }}/validated-dist
      shell: bash
      run: node .github/actions/validated-dist/verify.mjs
