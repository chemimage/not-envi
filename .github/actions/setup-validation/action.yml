name: Set up Hyve validation
description: Install locked Node dependencies and reuse shared WASM kernels, optionally with a browser.

inputs:
  fmap-core:
    description: Download the fmap and RGB kernels built by this workflow run.
    default: 'true'
  browser:
    description: Install a browser and its system dependencies.
    default: 'false'
  browser-engine:
    description: Playwright browser engine to install.
    default: chromium

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
      shell: bash
    - name: Download shared fmap core
      if: inputs.fmap-core == 'true'
      uses: actions/download-artifact@v8
      with:
        name: fmap-core
        path: wasm/fmap/pkg
    - name: Download shared RGB kernel
      if: inputs.fmap-core == 'true'
      uses: actions/download-artifact@v8
      with:
        name: rgb-kernel
        path: wasm/rgb/pkg
    - name: Cache browser
      if: inputs.browser == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ inputs.browser-engine }}-${{ hashFiles('package-lock.json') }}
    - name: Install browser and system dependencies
      if: inputs.browser == 'true'
      env:
        BROWSER_ENGINE: ${{ inputs.browser-engine }}
      run: npx playwright install --with-deps "$BROWSER_ENGINE"
      shell: bash
