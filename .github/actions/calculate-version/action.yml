name: Calculate release version
description: Calculate the same tag and commit-based release version locally and in CI using Node.
inputs:
  check-package:
    description: Require package files and the release tag to match the calculated version.
    default: 'false'
outputs:
  version:
    description: Calculated stable release version.
    value: ${{ steps.calculate.outputs.version }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - id: calculate
      run: node scripts/calculate-version.mjs --github-output
      shell: bash
    - if: inputs.check-package == 'true'
      run: node scripts/calculate-version.mjs --check
      shell: bash
