name: Release Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/validated-dist
      - name: Select authored release notes or generated fallback
        id: notes
        shell: bash
        run: |
          NOTES_PATH="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -s "$NOTES_PATH" ]; then
            echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          files: |
            dist/index.html
            dist/coverage-summary.json
            dist/coverage-badge.json
