name: Release Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/calculate-version
        with:
          check-package: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Verify tag matches package version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "This workflow only supports tag pushes."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Select authored release notes or generated fallback
        id: notes
        shell: bash
        run: |
          NOTES_PATH="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -s "$NOTES_PATH" ]; then
            echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          files: dist/index.html
