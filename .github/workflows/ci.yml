name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/calculate-version
        id: version

  fmap-core:
    name: Lint and build shared fmap core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
        with:
          fmap-core: 'false'
      - run: npm run lint
      - name: Cache pinned fmap C toolchain
        id: wasi
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/wasi-sdk-24.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-24-c6c38aab56e5de88
      - name: Install pinned fmap C toolchain
        if: steps.wasi.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' c6c38aab56e5de88adf6c1ebc9c3ae8da72f88ec2b656fb024eda8d4167a0bc5 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
      - name: Build and test the C/WASM ABI
        run: npm run build:fmap
        env:
          FMAP_CLANG: ${{ runner.temp }}/wasi-sdk-24.0-x86_64-linux/bin/clang
      - uses: actions/upload-artifact@v7
        with:
          name: fmap-core
          path: wasm/fmap/pkg/
          if-no-files-found: error
          retention-days: 1

  checks:
    name: Test ${{ matrix.suite }}
    needs: fmap-core
    # Playwright 1.58 supports Ubuntu 24.04; ubuntu-latest can select 26.04.
    runs-on: ${{ matrix.suite == 'desktop-webkit' && 'macos-latest' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: true
      matrix:
        suite:
          - unit
          - app-browser
          - desktop-webkit
          - benchmarks
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
        with:
          browser: ${{ matrix.suite != 'unit' }}
          browser-engine: ${{ matrix.suite == 'desktop-webkit' && 'webkit' || 'chromium' }}
      - name: Unit and controller tests
        if: matrix.suite == 'unit'
        run: npm run test:coverage
      - name: Retain measured JavaScript coverage
        if: matrix.suite == 'unit'
        uses: actions/upload-artifact@v7
        with:
          name: js-coverage
          path: |
            coverage/coverage-summary.json
            coverage/coverage-badge.json
          if-no-files-found: error
          retention-days: 30
      - name: Desktop browser and large-file tests
        if: matrix.suite == 'app-browser'
        run: |
          npm run test:e2e
          npm run test:fmap-large
      - name: Desktop Safari engine coverage
        if: matrix.suite == 'desktop-webkit'
        run: npx playwright test --browser=webkit
      # Keep checked benchmarks sequential on their own runner: concurrent
      # browser/unit tests would contaminate the reported latency measurements.
      - name: Checked browser and queue benchmarks
        if: matrix.suite == 'benchmarks'
        run: |
          npm run benchmark:fmap-browser -- --output test-results/fmap-performance.json
          npm run benchmark:fmap-queues -- --output test-results/fmap-queues.json
      - name: Retain checked benchmark reports
        if: always() && matrix.suite == 'benchmarks'
        uses: actions/upload-artifact@v7
        with:
          name: fmap-performance
          path: |
            test-results/fmap-performance.json
            test-results/fmap-queues.json
          if-no-files-found: warn
      - name: Retain browser failure diagnostics
        if: failure() && matrix.suite != 'unit' && matrix.suite != 'benchmarks'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: Package and verify tested distribution
    needs: [version, fmap-core, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set the calculated version in the build checkout
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node --input-type=module -e 'import { stampPackageVersion } from "./scripts/publication.mjs"; stampPackageVersion(process.env.RELEASE_VERSION);'
      - uses: ./.github/actions/setup-validation
        with:
          browser: 'true'
      - name: Build the single-file distribution once
        run: npm run build
      - name: Test this exact packaged HTML offline
        run: npx playwright test --config=playwright.fmap-packaged.config.js
        env:
          FMAP_PACKAGED: '1'
      - name: Reuse coverage from this run's unit tests
        uses: actions/download-artifact@v8
        with:
          name: js-coverage
          path: dist
      - name: Record the tested distribution identity
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const sha256 = name => createHash('sha256').update(readFileSync(`dist/${name}`)).digest('hex');
          writeFileSync('dist/manifest.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            version: process.env.RELEASE_VERSION,
            sha256: sha256('index.html'),
            reports: Object.fromEntries(['coverage-summary.json', 'coverage-badge.json'].map(name => [name, sha256(name)]))
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: |
            dist/index.html
            dist/manifest.json
            dist/coverage-summary.json
            dist/coverage-badge.json
          if-no-files-found: error
          retention-days: 30

  validate:
    # Preserve the existing check name, and fail rather than report a skipped
    # success when a prerequisite fails or the matrix is cancelled.
    needs: [version, fmap-core, checks, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks and packaged-output verification to succeed
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          CORE_RESULT: ${{ needs.fmap-core.result }}
          CHECK_RESULT: ${{ needs.checks.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$VERSION_RESULT" = success && test "$CORE_RESULT" = success && test "$CHECK_RESULT" = success && test "$PACKAGE_RESULT" = success
