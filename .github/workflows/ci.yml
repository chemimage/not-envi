name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install pinned fmap Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build:fmap
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run test:fmap-large
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/index.html
